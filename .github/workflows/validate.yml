name: Validate Pasión Travel Tour
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check admin/admin.js
          node --check admin/ai.js
